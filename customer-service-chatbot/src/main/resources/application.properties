spring.application.name=customer-service-chatbot

# Server Configuration (Default 8080, overridable with SERVER_PORT)
server.port=${SERVER_PORT:8080}

# Chatbot Configuration Properties
chatbot.confidence-threshold=0.45
chatbot.seed=42
chatbot.model-path=models/intent-model.bin
chatbot.confusion-matrix-path=target/reports/confusion-matrix.csv

# Session Configuration
chatbot.session.max-entries=1000
chatbot.session.ttl-minutes=60

# Logging
logging.level.root=INFO
logging.level.com.example.chatbot=INFO
logging.level.opennlp=WARN
